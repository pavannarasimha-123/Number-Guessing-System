<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, Helvetica, sans-serif;
        }

        .game-card {
            background: #fff;
            padding: 30px;
            width: 340px;
            max-width: 92vw;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        h1 { margin: 0 0 8px; }
        p { color: #555; font-size: 15px; }

        input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
        }
        input:focus { border-color: #667eea; }

        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background-color: #667eea;
            color: white;
            cursor: pointer;
        }
        button:hover { background-color: #5a67d8; }
        button:disabled { background-color: #b3b8ee; cursor: not-allowed; }

        #restart { margin-top: 10px; background-color: #48bb78; display: none; }
        #restart:hover { background-color: #38a169; }

        #result { margin-top: 15px; font-weight: bold; min-height: 22px; }
        .success { color: green; }
        .error { color: red; }
        .hint { color: #d97706; }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #444;
            margin-top: 12px;
        }
        #history { font-size: 13px; color: #777; margin-top: 8px; min-height: 18px; }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>🎯 Guess the Number</h1>
        <p>Guess a number between <strong>1 and 100</strong></p>

        <input
            type="number"
            id="guessInput"
            placeholder="Enter your guess"
            min="1"
            max="100"
            autofocus
        >

        <button id="submit">Guess</button>
        <button id="restart">Play Again</button>

        <p id="result"></p>

        <div class="stats">
            <span>Attempts: <strong id="attempts">0</strong></span>
            <span>Best: <strong id="best">–</strong></span>
        </div>
        <div id="history"></div>
    </div>

    <script src="temp.js"></script>
</body>
</html>
